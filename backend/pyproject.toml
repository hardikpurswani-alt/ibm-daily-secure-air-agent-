[project]
name = "airguard-backend"
version = "1.0.0"
description = "FastAPI backend, RAG engine, IBM Granite reasoning, and IBM watsonx Orchestrate integration for AirGuard AI"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.35",
    "httpx>=0.27.2",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.12",
    "ibm-watsonx-ai>=1.1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2.0"]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
